org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
outfitter_source=repsy
mod_id=integrity
mod_version=1.1.0-SNAPSHOT
maven_group=fr.moulou
archives_base_name=integrity
# Publication MDTK utilisée par les essais manuels ; sa racine reste dans machine.properties.
mdtk_version=1.0.0
# Une petite map suffit aux essais de connexion ; ne pas recopier tout l'entrepôt.
outfitter.maps=World_Flat_MushroomFields
outfitter.log_level=info
outfitter.mod_log_level=debug
outfitter.log_format=compact
# Publication sur Modrinth, CurseForge et GitHub (plugins integrity.publication et integrity.game-version) : les identifiants publics des
# deux projets, le slug CurseForge et le dépôt owner/repo. Les jetons ne vivent jamais ici : MODRINTH_TOKEN, CURSEFORGE_TOKEN et GITHUB_TOKEN,
# posés par dev-secrets.ps1 dans le terminal qui publie. Sans -Ppublish_live=true, publishMods est un essai à blanc.
modrinth_project_id=4xZCjoWU
curseforge_project_id=1745972
curseforge_project_slug=integrity
github_repository=Roumoulou/Integrity

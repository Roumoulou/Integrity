[versions]
kotlin = "2.4.21"
java = "25"
outfitter = "0.4.0-SNAPSHOT"
storify = "0.6.0-SNAPSHOT"
tomlkt = "0.6.1"
json5 = "0.8.0"
junit = "6.1.3"
kotlinx-serialization = "1.11.0"
proguard = "7.10.0"
mod-publish = "2.2.1"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
storify = { module = "fr.moulou:storify", version.ref = "storify" }
tomlkt = { module = "dev.eav.tomlkt:tomlkt", version.ref = "tomlkt" }
json5 = { module = "li.songe:json5", version.ref = "json5" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
proguard = { module = "com.guardsquare:proguard-gradle", version.ref = "proguard" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
outfitter = { id = "fr.moulou.outfitter", version.ref = "outfitter" }
mod-publish = { id = "me.modmuss50.mod-publish-plugin", version.ref = "mod-publish" }
